name: Daily undervalued Nasdaq screen

# on:
  # schedule:
    # 月〜土 07:00 UTC = 月〜土 16:00 JST
    # 内訳: 月=JP のみ / 火〜金=US+JP / 土=US のみ（曜日判定は src/main.py で実施）
    # - cron: "0 7 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack に送らず実行する"
        type: boolean
        default: false

# GITHUB_TOKEN に最低限の権限を明示。Org/Repo の既定が "no permissions" でも
# checkout が 401 を受けないようにする。
permissions:
  contents: read

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Org の既定権限で GITHUB_TOKEN が 401 になるため、明示的に PAT を使う。
          # PAT には `contents: read`（fine-grained）または `repo`（classic）を付与すること。
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screening pipeline
        env:
          # 出力先: Google Sheets / Drive (Service Account 認証、Drive scope 追加済み)
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID || '1GG561CtYIi30c3ljsDaAdUd2ddF18z4J21fQ-N-vo6Y' }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID || '1e0_XPuoi6vh4-tkd-V3pwW-oV5M7p9JE' }}
          # Claude による銘柄分析
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # SEC EDGAR は User-Agent 必須 (連絡先メール推奨)
          EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT || 'finviz-alphaspea-bot analytics@spenda-c.com' }}
          # 旧 Slack 設定 (現在は未使用、必要なら notify_slack.py から再有効化可)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL || 'C0B4BPA4W2D' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi
